<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07080b"><title>Download Tools — Xtract & Shrink</title>
<style>
:root{color-scheme:dark;--bg:#07080b;--line:rgba(255,255,255,.12);--ink:#f3f5f9;--muted:#99a2b7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100dvh;padding:calc(50px + env(safe-area-inset-top)) 18px calc(35px + env(safe-area-inset-bottom));background:#07080b;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;inset:-15% -5% auto;height:80vh;pointer-events:none;background:radial-gradient(ellipse at 20% 14%,#55389052,transparent 48%),radial-gradient(ellipse at 85% 8%,#0b86904c,transparent 50%);filter:blur(28px)}
main{position:relative;max-width:700px;margin:0 auto}
.kicker{color:#b9b0f7;letter-spacing:.18em;font-size:11px;font-weight:700}h1{font-size:clamp(32px,7vw,44px);line-height:1.2;margin:12px 0 8px;letter-spacing:-.04em}.lead{font-size:14px;color:var(--muted);margin:0 0 30px}
.apps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.tile{display:flex;flex-direction:column;align-items:flex-start;text-decoration:none;color:inherit;padding:21px;border:1px solid var(--line);border-radius:26px;background:rgba(255,255,255,.05);box-shadow:0 20px 50px -30px #000;transition:transform .16s,border .16s}
.tile:active{transform:scale(.975)}.tile:focus-visible{outline:2px solid #9a89ff;outline-offset:3px}.tile:hover{border-color:#857bb0}
.tile img{width:70px;height:70px;border-radius:19px;margin-bottom:19px;box-shadow:0 10px 25px #0007}.tile h2{margin:0;font-size:20px;letter-spacing:-.025em}.tile p{color:#9da7bd;line-height:1.7;font-size:12px;min-height:44px;margin:7px 0 16px}.go{margin-top:auto;display:flex;gap:7px;align-items:center;color:#c9d4e8;font-size:12px;font-weight:700}.pill{display:inline-block;border:1px solid #7165a357;background:#8b5cf61c;border-radius:100px;padding:4px 9px;color:#c4b5fd;font-size:10px;font-weight:700;margin-top:12px}
.note{color:#70798d;font-size:11px;line-height:1.85;margin:28px 4px}
@media(max-width:480px){.tile{padding:17px;border-radius:21px}.tile img{width:60px;height:60px;border-radius:17px}.tile h2{font-size:18px}.tile p{font-size:11px;min-height:54px}}
</style></head><body><main><div class="kicker">DOWNLOAD TOOLS</div><h1>動画を、もっと自由に。</h1><p class="lead">目的に合わせて、2つのツールから選択。</p>
<section class="apps" aria-label="ツールを選択">
<a class="tile" href="/x.html"><img src="/icon.svg" alt=""><h2>Xtract</h2><span class="pill">X / Twitter</span><p>Xの公開ポストから動画を取得。画質を選んで保存。</p><span class="go">動画を保存する　›</span></a>
<a class="tile" href="/shrink.html"><img src="/shrink-icon.svg" alt=""><h2>Shrink</h2><span class="pill">ON DEVICE</span><p>手元の動画を一括軽量化。ファイルは端末の外に送信しません。</p><span class="go">動画を軽くする　›</span></a>
</section><p class="note">Shrinkの動画処理は端末内だけで完結します。Xtractは公開ポストの取得時に外部サービスへ接続します。</p></main></body></html>
